plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metot.mobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.metot.mobile"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "11.4.82"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
